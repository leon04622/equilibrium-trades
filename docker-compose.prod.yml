# Example production stack: app + Postgres. Copy to your server, add a .env file next to this compose file.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required in .env:
#   POSTGRES_PASSWORD, PUBLIC_APP_URL, STRIPE_* (optional), VITE_BUILDER_ADDRESS, VITE_HL_REFERRAL_CODE
# Optional: APP_PORT (default 5000)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: equilibrium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: equilibrium
    volumes:
      - eq_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equilibrium -d equilibrium"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BUILDER_ADDRESS: ${VITE_BUILDER_ADDRESS:-}
        VITE_HL_REFERRAL_CODE: ${VITE_HL_REFERRAL_CODE:-}
        VITE_STRIPE_PAYMENT_LINK_PRO: ${VITE_STRIPE_PAYMENT_LINK_PRO:-}
        VITE_STRIPE_PAYMENT_LINK_MENTORING: ${VITE_STRIPE_PAYMENT_LINK_MENTORING:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://equilibrium:${POSTGRES_PASSWORD}@postgres:5432/equilibrium
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL to https://your-domain}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eq_prod_pg:
